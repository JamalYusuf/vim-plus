<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }} — Keyboard-first Chrome{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="stylesheet" href="{{ "css/site.css" | absURL }}">
  <link rel="canonical" href="{{ .Permalink }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ .Site.Home.Permalink }}"><span class="v">Vim</span><span class="p">+</span></a>
      <span class="brand-sub">Keyboard-first Chrome</span>
      <nav class="nav" aria-label="Main">
        {{ range .Site.Menus.main }}
          {{ $isExt := or (hasPrefix .URL "http://") (hasPrefix .URL "https://") }}
          <a href="{{ if $isExt }}{{ .URL }}{{ else }}{{ .URL | absURL }}{{ end }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}{{ if $isExt }} rel="noopener"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer">
    <p><strong>Vim+</strong> v{{ .Site.Params.version }} · by
      <a href="{{ .Site.Params.authorUrl }}" rel="noopener">{{ .Site.Params.author }}</a>
      · <a href="{{ .Site.Params.github }}" rel="noopener">GitHub</a>
      · Apache-2.0</p>
  </footer>
</body>
</html>
