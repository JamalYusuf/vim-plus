<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Vim+ demo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="55%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1014"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- fake browser chrome -->
  <rect x="64" y="48" width="1152" height="624" rx="12" fill="#111113" stroke="#27272a" stroke-width="2"/>
  <rect x="64" y="48" width="1152" height="44" rx="12" fill="#161618"/>
  <rect x="64" y="80" width="1152" height="12" fill="#161618"/>
  <circle cx="96" cy="70" r="6" fill="#3f3f46"/>
  <circle cx="118" cy="70" r="6" fill="#3f3f46"/>
  <circle cx="140" cy="70" r="6" fill="#3f3f46"/>
  <rect x="200" y="58" width="720" height="24" rx="6" fill="#0a0a0b" stroke="#27272a"/>
  <text x="216" y="75" fill="#71717a" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13">https://example.com/long-article</text>
  <!-- reading progress -->
  <rect x="64" y="92" width="1152" height="4" fill="#27272a"/>
  <rect x="64" y="92" width="480" height="4" fill="url(#bar)"/>
  <!-- page lines -->
  <rect x="120" y="140" width="420" height="18" rx="4" fill="#27272a"/>
  <rect x="120" y="176" width="640" height="12" rx="3" fill="#1f1f23"/>
  <rect x="120" y="200" width="600" height="12" rx="3" fill="#1f1f23"/>
  <rect x="120" y="224" width="560" height="12" rx="3" fill="#1f1f23"/>
  <rect x="120" y="260" width="200" height="12" rx="3" fill="#3f1d28"/>
  <rect x="120" y="284" width="580" height="12" rx="3" fill="#1f1f23"/>
  <rect x="120" y="308" width="520" height="12" rx="3" fill="#1f1f23"/>
  <!-- link hints -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700">
    <rect x="340" y="252" width="28" height="22" rx="4" fill="#e11d48"/>
    <text x="347" y="268" fill="#fff">A</text>
    <rect x="120" y="360" width="28" height="22" rx="4" fill="#e11d48"/>
    <text x="127" y="376" fill="#fff">S</text>
    <rect x="220" y="360" width="28" height="22" rx="4" fill="#e11d48"/>
    <text x="227" y="376" fill="#fff">D</text>
  </g>
  <rect x="160" y="364" width="180" height="12" rx="3" fill="#3f1d28"/>
  <rect x="260" y="364" width="160" height="12" rx="3" fill="#3f1d28"/>
  <!-- omnibar mock -->
  <rect x="280" y="200" width="720" height="280" rx="10" fill="#0c0c0e" stroke="#e11d48" stroke-width="2" opacity="0.96"/>
  <rect x="304" y="224" width="672" height="36" rx="8" fill="#18181b" stroke="#3f3f46"/>
  <text x="320" y="248" fill="#fda4af" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16">:read  ·  reader view</text>
  <rect x="304" y="280" width="672" height="40" rx="6" fill="#1a1014" stroke="#3f3f46"/>
  <text x="320" y="306" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15">:prog — toggle reading progress</text>
  <rect x="304" y="328" width="672" height="40" rx="6" fill="#111113"/>
  <text x="320" y="354" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="15">:hl — highlighter</text>
  <rect x="304" y="376" width="672" height="40" rx="6" fill="#111113"/>
  <text x="320" y="402" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="15">:zen — focus window</text>
  <!-- brand -->
  <text x="640" y="620" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">Vim<span fill="#e11d48">+</span></text>
  <text x="640" y="658" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="16">Keyboard-first Chrome · demo placeholder</text>
</svg>
