# Deploy Hugo docs to the gh-pages branch (GitHub Pages).
# After the first successful run (or local push of gh-pages):
#   Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages / (root)
# Site: https://jamalyusuf.github.io/vim-plus/
name: Deploy documentation site

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: true

      - name: Build site
        working-directory: site
        run: hugo --minify --gc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/public
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          # Keep a .nojekyll so GitHub Pages serves paths as-is (Hugo already emits this if configured)
          enable_jekyll: false
