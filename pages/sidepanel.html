<!DOCTYPE html>
<html spellcheck="false" class="loading vp-dark">
  <head>
    <meta charset="utf-8">
    <title>Vim+ Command Center</title>
    <meta name="color-scheme" content="dark light">
    <script src="theme-boot.js"></script>
    <script type="module" src="async_bg.js"></script>
    <script type="module" src="sidepanel.js"></script>
    <link rel="stylesheet" href="options.css">
    <link rel="stylesheet" href="vim-plus-theme.css">
    <style>
      html, body {
        margin: 0; padding: 0; min-width: 300px; height: 100%;
        background: var(--vp-bg, #0a0a0b);
        color: var(--vp-fg, #f4f4f5);
      }
      body {
        font: 13px/1.4 var(--vp-font, system-ui, sans-serif);
        display: flex; flex-direction: column; min-height: 100vh;
      }
      #top {
        padding: 12px 12px 0;
        border-bottom: 2px solid var(--vp-red, #e11d48);
        background: var(--vp-bg-panel, #161618);
        flex: 0 0 auto;
      }
      h1 {
        font-size: 14px; margin: 0 0 8px; font-weight: 700;
        letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px;
      }
      h1 .h1-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
      h1 .h1-actions button {
        border: 1px solid var(--vp-border-color, #3f3f46); background: var(--vp-bg-elevated, #111113);
        color: var(--vp-fg, #f4f4f5); padding: 4px 8px; font-size: 10px; font-weight: 700;
        letter-spacing: .04em; text-transform: uppercase; cursor: pointer; display: inline-flex;
        align-items: center; gap: 4px;
      }
      h1 .h1-actions button:hover { background: var(--vp-red, #e11d48); color: #fff; border-color: var(--vp-red); }
      h1 .h1-actions button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }
      /* Site power toggle (default ON) — sits with brand badge */
      h1 .badge, #site-power {
        font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
        padding: 3px 8px; background: var(--vp-red, #e11d48); color: #fff; font-weight: 700;
        border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      }
      #site-power svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; }
      #site-power.on { background: #16a34a; border-color: #15803d; }
      #site-power.off { background: #52525b; border-color: #3f3f46; color: #e4e4e7; }
      #site-power:hover { filter: brightness(1.08); outline: 1px solid #fff; }
      #site-bar {
        display: flex; gap: 6px; margin: 0 0 8px; flex-wrap: wrap;
      }
      #site-bar button {
        flex: 1; min-width: 40%; border: 1px solid var(--vp-border-color, #3f3f46);
        background: var(--vp-bg-elevated, #111113); color: var(--vp-fg);
        padding: 7px 8px; font-size: 11px; font-weight: 600; cursor: pointer;
      }
      #site-bar button:hover { border-color: var(--vp-red); color: #fff; background: var(--vp-red); }
      #status-line {
        font-size: 11px; color: var(--vp-fg-muted, #a1a1aa);
        margin-bottom: 8px; word-break: break-all;
      }
      #status-line strong { color: var(--vp-fg, #f4f4f5); font-weight: 600; }
      #mode-tabs {
        display: flex; gap: 0; margin: 0 -12px;
        border-top: 1px solid var(--vp-border-color, #27272a);
      }
      #mode-tabs button {
        flex: 1; border: none; border-radius: 0; border-bottom: 2px solid transparent;
        background: transparent; color: var(--vp-fg-muted, #a1a1aa);
        padding: 8px 4px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
        cursor: pointer; font-weight: 600;
      }
      #mode-tabs button:hover { color: var(--vp-fg, #f4f4f5); background: var(--vp-hover); }
      #mode-tabs button.active {
        color: #fff; border-bottom-color: var(--vp-red, #e11d48);
        background: var(--vp-red-dim, rgba(225,29,72,.14));
      }
      #search-wrap { padding: 10px 12px 6px; flex: 0 0 auto; }
      #q {
        width: 100%; box-sizing: border-box; padding: 9px 10px;
        background: var(--vp-input-bg, #0c0c0e);
        border: 1px solid var(--vp-border-color, #27272a);
        color: var(--vp-input-fg, #e4e4e7); border-radius: 0; font-size: 13px;
      }
      #q:focus { border-color: var(--vp-red, #e11d48); outline: none; box-shadow: 0 0 0 1px var(--vp-red); }
      #list {
        flex: 1 1 auto; overflow: auto; min-height: 120px;
        border-top: 1px solid var(--vp-border-color, #27272a);
      }
      .row {
        display: flex; gap: 8px; align-items: center;
        padding: 7px 12px; cursor: pointer;
        border-bottom: 1px solid var(--vp-border-color, #27272a);
      }
      .row:hover, .row.sel { background: var(--vp-red-dim, rgba(225,29,72,.14)); }
      .row.sel { outline: 1px solid var(--vp-red, #e11d48); outline-offset: -1px; }
      .row kbd {
        font: 10px/1.2 var(--vp-mono, monospace);
        min-width: 2.8em; text-align: center;
        background: var(--vp-red, #e11d48); color: #fff; padding: 2px 5px;
      }
      .row .main { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .row .sub { color: var(--vp-fg-muted, #a1a1aa); font-size: 10px; max-width: 40%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { padding: 16px 12px; color: var(--vp-fg-muted); font-size: 12px; }
      #actions {
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
        background: var(--vp-border-color, #27272a);
        flex: 0 0 auto;
      }
      #actions button {
        border: none; border-radius: 0; background: var(--vp-bg-elevated, #111113);
        color: var(--vp-fg); padding: 9px 4px; font-size: 10px; letter-spacing: .03em;
        text-transform: uppercase; font-weight: 600; cursor: pointer;
      }
      #actions button:hover { background: var(--vp-red, #e11d48); color: #fff; }
      #toast {
        flex: 0 0 auto; min-height: 22px; padding: 4px 12px;
        font-size: 11px; color: var(--vp-red-hover, #f43f5e);
        background: var(--vp-bg-panel); border-top: 1px solid var(--vp-border-color, #27272a);
      }
      #hint {
        flex: 0 0 auto; padding: 6px 12px 10px;
        font-size: 10px; color: var(--vp-fg-muted); line-height: 1.45;
        border-top: 1px solid var(--vp-border-color, #27272a);
      }
      #hint kbd {
        background: var(--vp-red); color: #fff; font-size: 9px; padding: 1px 4px;
      }
      html.loading #app { content-visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="app" style="display:flex;flex-direction:column;min-height:100vh">
      <div id="top">
        <h1 class="brand">
          <span><span class="Vim">Vim</span><span class="C">+</span></span>
          <button type="button" id="site-power" class="on" title="Toggle Vim+ for this site (default ON)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
            <span id="badge">ON</span>
          </button>
          <span class="h1-actions">
            <button type="button" id="btn-options" title="Open full options">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
              Options
            </button>
          </span>
        </h1>
        <div id="status-line"><strong id="host">…</strong><br><span id="meta">Loading…</span></div>
        <div id="site-bar">
          <button type="button" id="btn-wiki" title="Open Vim+ wiki">Wiki</button>
          <button type="button" id="btn-help" title="Open help">Help</button>
        </div>
        <div id="mode-tabs">
          <button type="button" data-mode="keys" class="active">Keys</button>
          <button type="button" data-mode="cmds">Cmds</button>
          <button type="button" data-mode="tabs">Tabs</button>
          <button type="button" data-mode="closed">Closed</button>
          <button type="button" data-mode="read">Later</button>
          <button type="button" data-mode="page">Page</button>
        </div>
      </div>
      <div id="search-wrap">
        <input id="q" type="search" placeholder="Filter…  j/k move · Enter run · 1–5 modes" autocomplete="off" autofocus />
      </div>
      <div id="list"></div>
      <div id="actions">
        <button type="button" data-act="bookmark">Bookmark</button>
        <button type="button" data-act="readingList">Read later</button>
        <button type="button" data-act="toggleGroup">Group</button>
        <button type="button" data-act="copyUrl">Copy URL</button>
        <button type="button" data-act="reload">Reload</button>
        <button type="button" data-act="pin">Pin</button>
        <button type="button" data-act="mute">Mute</button>
        <button type="button" data-act="duplicate">Duplicate</button>
      </div>
      <div id="toast"></div>
      <div id="hint">
        Open: <kbd>toolbar</kbd> · <kbd>Alt+Shift+V</kbd> · <kbd>gS</kbd><br>
        Mouse-free: filter · <kbd>j</kbd>/<kbd>k</kbd> · <kbd>Enter</kbd> · modes <kbd>1</kbd>–<kbd>6</kbd><br>
        <kbd>gW</kbd> windows · <kbd>zd</kbd> sleep tab · <kbd>yp</kbd> PiP · <kbd>X</kbd> restore · Closed mode for sessions
      </div>
    </div>
  </body>
</html>
